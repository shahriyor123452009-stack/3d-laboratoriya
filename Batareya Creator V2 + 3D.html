<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Batareya Creator V3</title>
<style>
:root{color-scheme:dark;--bg:#17291f;--pn:#223a2e;--ed:#44634f;--tx:#f5f1de;--mu:#aac4b3;--cu:#ffd166}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.3 Bahnschrift,"Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.title{display:flex;gap:8px;align-items:center;height:40px;padding:0 14px 0 10px;background:var(--pn);border:1px solid var(--ed);border-radius:12px;font-weight:700;font-size:14px}
.title svg{color:var(--cu)}
.bt,.ib{display:grid;place-items:center;background:var(--pn);border:1px solid var(--ed);color:var(--tx)}
.bt{width:40px;height:40px;border-radius:12px;margin-left:8px}
.hud .r{display:flex}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hint{position:fixed;left:0;right:120px;text-align:center;color:var(--mu);pointer-events:none;transition:opacity .4s;padding:0 16px;bottom:max(16px,env(safe-area-inset-bottom))}
#dock{position:fixed;top:max(58px,env(safe-area-inset-top)+48px);right:0;bottom:0;width:108px;background:var(--pn);border-left:1px solid var(--ed);padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;z-index:5;transition:width .25s,padding .25s}
#tr{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;flex-shrink:0}
#tabs{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;overflow-y:auto;touch-action:pan-y;max-height:40%}
.tab{flex:0 0 auto;padding:0 6px;height:34px;border-radius:10px;border:1px solid transparent;background:none;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;width:100%}
.tab svg.i{width:16px;height:16px;flex-shrink:0}
.tab.on{background:#2d4a3b;border-color:var(--cu);color:var(--cu)}
#items{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding-bottom:4px}
.it{flex:0 0 auto;width:100%;height:68px;border-radius:12px;background:#1b3027;border:1px solid var(--ed);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:pan-y}
.it svg{width:56px;height:28px}
.it span{font-size:10px;color:var(--mu);text-align:center;line-height:1.15;padding:0 2px}
#pop{position:fixed;display:none;gap:6px;padding:6px;background:var(--pn);border:1px solid var(--ed);border-radius:18px;box-shadow:0 8px 24px #000a;align-items:center;z-index:9}
#pop.on{display:flex}
.ib{width:40px;height:40px;border-radius:50%}
.ib:active,.bt:active{background:#1d2b3a}
.ib.rd{color:#ff7b7b}
.tg{padding:0 6px;color:var(--mu);font-weight:700;min-width:54px;text-align:center}
.lb{fill:#b9d0c0;font-size:11px;paint-order:stroke;stroke:#17291f;stroke-width:3px}
#pop{flex-wrap:wrap;max-width:min(94vw,340px);justify-content:center}.ib{font-size:12px;font-weight:700}
#info,#menu{position:fixed;background:var(--pn);border:1px solid var(--ed);border-radius:16px;box-shadow:0 8px 28px #000b;z-index:10;display:none;touch-action:pan-y;overflow:auto;user-select:text;-webkit-user-select:text}
#info.on,#menu.on{display:block}
#info{left:10px;top:62px;width:min(320px,calc(100vw - 20px));max-height:52vh;padding:10px 12px}
#menu{right:10px;top:62px;bottom:10px;width:min(340px,calc(100vw - 20px));padding:10px 12px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid #2f4c3d}.kv span{color:var(--mu)}.kv b{text-align:right}
.fm{color:var(--cu);font-size:12px;padding:6px 0}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h4{color:var(--cu);margin:14px 0 6px;font-size:12px;text-transform:uppercase}
.mb{padding:8px 10px;border-radius:10px;background:#1b3027;border:1px solid var(--ed);margin:0 6px 6px 0}.mb.on{border-color:var(--cu);color:var(--cu)}
textarea{width:100%;height:70px;background:#17291f;color:var(--tx);border:1px solid var(--ed);border-radius:8px;font:11px monospace;padding:6px;user-select:text;-webkit-user-select:text;touch-action:auto;margin-bottom:6px}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#2d4a3b;border:1px solid var(--cu);padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:12;max-width:90vw;text-align:center}
#clp svg{transition:transform .2s}#dock.cl{width:44px;padding-left:4px;padding-right:4px}#dock.cl #clp svg{transform:rotate(180deg)}#dock.cl #items{display:none}#dock.cl #tr{margin-bottom:0}#dock.cl .tab span{display:none}#dock.cl .tab{justify-content:center;padding:0}
#v3{position:fixed;inset:0;display:none;opacity:0;transition:opacity .5s;background:#17291f}#v3.on{opacity:1}#v3 canvas{display:block;width:100%;height:100%;touch-action:none}
.bt.on{border-color:var(--cu);color:var(--cu);background:#2d4a3b}.bt b{font-size:13px}

@media(max-width:430px){.title span{display:none}.title{padding:0 10px}#dock{width:96px}#dock.cl{width:42px}}
body.m3 #hint{display:none}
#xp{position:fixed;left:10px;top:62px;bottom:10px;width:min(380px,calc(100vw - 20px));background:var(--pn);border:1px solid var(--ed);border-radius:16px;box-shadow:0 10px 30px #0008;z-index:11;display:none;flex-direction:column;overflow:hidden;user-select:text;-webkit-user-select:text;touch-action:pan-y}
#xp.on{display:flex}
#xp .xh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;font-size:15px}
#xp .xt{display:flex;gap:6px;padding:0 10px 8px;flex-wrap:wrap}#xp .xt .mb{margin:0;padding:7px 11px}
#xp .xb{flex:1;overflow:auto;padding:4px 12px 14px;-webkit-overflow-scrolling:touch}
#xp .xc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:10px 12px;margin:0 0 8px;border-radius:12px;background:#1b3027;border:1px solid var(--ed)}
#xp .xc span{color:var(--mu);font-size:12px;line-height:1.35}#xp .xc.on{border-color:var(--cu)}
#xp .xr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #2f4c3d}#xp .xr b{color:var(--cu);font-variant-numeric:tabular-nums}
#xp .xg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}#xp .xg .mb{margin:0}
#xp .xs{margin-bottom:14px;padding:10px;border:1px solid var(--ed);border-radius:12px;background:#1b3027}#xp .xs h4{margin:0 0 6px}
#xp .xn,#xp .doc{color:var(--mu);font-size:12px;line-height:1.45;margin-top:8px}#xp code{color:var(--cu);font-size:11px}
#xp table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}#xp td,#xp th{padding:4px;text-align:right;border-bottom:1px solid #2f4c3d}#xp th{color:var(--mu);font-weight:600}
#xp input[type=text]{width:100%;background:#17291f;color:var(--tx);border:1px solid var(--ed);border-radius:8px;padding:8px;margin-bottom:6px;font:inherit;touch-action:auto}
#xp input[type=range]{width:100%;accent-color:#ffd166;touch-action:auto;height:28px}
#xp textarea{height:110px}
#xp .ex{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #2f4c3d}
.title{background:linear-gradient(180deg,#2d4a3b,#223a2e)}
@media(pointer:coarse){.bt,.ib{min-width:44px;min-height:44px}.mb{padding:10px 12px}}
@media(max-width:600px){#xp{left:6px;right:6px;width:auto;top:auto;bottom:6px;max-height:64vh}.hud .r .bt{margin-left:5px}}
</style>

<pattern id="gp" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M20 0V40M0 20H40" stroke="#1d3428"/><path d="M40 0H0V40" fill="none" stroke="#2f4c3d"/></pattern>

// ---------- fizika: modified nodal analysis ----------
const NL={led:[1e-14,.075,3.2],dio:[1e-9,.039,1]};
function gauss(A,n){for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];const d=A[i][i];for(let r=i+1;r<n;r++){const f=A[r][i]/d;if(f)for(let k=i;k<=n;k++)A[r][k]-=f*A[i][k]}}
 const x=new Array(n);for(let i=n-1;i>=0;i--){let s=A[i][n];for(let k=i+1;k<n;k++)s-=A[i][k]*x[k];x[i]=s/A[i][i]}return x}
function lin(c,dt){const v=val(c),T0=T[c.t];if(T0.src)return[1/T0.r,v/T0.r];switch(c.t){case'res':case'rheo':return[1/v,0];case'cap':{const g=v*1e-6/dt;return[g,g*c.vc]}case'bulb':return[1/27,0];case'motor':return[1/12,0];case'grind':return[1/57,0];case'kettle':return[1/24.2,0];case'sw':return[c.on?1e3:1e-9,0];case'fuse':return[20,0];case'vm':return[1e-7,0];case'am':return[100,0];case'jn':return[1e3,0]}}
function simulate(dt){const cs=[...comps.values()];if(!cs.length)return;let n=0;cs.forEach(c=>{c.na=n++;c.nb=n++});const pn=t=>{const c=comps.get(t>>1);return t&1?c.nb:c.na};
 const nl=cs.filter(c=>!c.dead&&NL[c.t]);let V=[];
 for(let it=0;it<60;it++){const A=Array.from({length:n},()=>new Float64Array(n+1));for(let i=0;i<n;i++)A[i][i]+=1e-9;
  const stamp=(a,b,g,s)=>{A[a][a]+=g;A[b][b]+=g;A[a][b]-=g;A[b][a]-=g;A[a][n]+=s;A[b][n]-=s};
  wires.forEach(w=>stamp(pn(w.a),pn(w.b),w.dead?1e-9:1/w.R,0));
  cs.forEach(c=>{if(c.dead)return;if(NL[c.t]){const[is,nv,mx]=NL[c.t],e=Math.exp(Math.min(c.vd,mx)/nv),gd=is/nv*e+1e-9;stamp(c.na,c.nb,gd,-(is*(e-1)-gd*c.vd))}else{const[g,s]=lin(c,dt);stamp(c.na,c.nb,g,s)}});
  V=gauss(A,n);let ok=true;nl.forEach(c=>{const nv=V[c.na]-V[c.nb];if(Math.abs(nv-c.vd)>1e-4)ok=false;c.vd=Math.min(clamp(nv,c.vd-1,c.vd+.2),NL[c.t][2])});if(ok)break}
 wires.forEach(w=>{w.I=w.dead?0:(V[pn(w.a)]-V[pn(w.b)])/w.R;w.P=w.I*w.I*w.R});
 cs.forEach(c=>{const v=V[c.na]-V[c.nb];c.v=v;let i=0;if(!c.dead){if(NL[c.t]){const[is,nv,mx]=NL[c.t];i=is*(Math.exp(Math.min(c.vd,mx)/nv)-1)}else{const[g,s]=lin(c,dt);i=g*v-s;if(c.t=='cap')c.vc=v}}
  c.I=i;c.E+=Math.abs(v*i)*dt;const lim=c.t=='fuse'?val(c):T[c.t].lim;
  if(lim&&!c.dead){if(Math.abs(i)>lim)c.hot+=dt;else c.hot=Math.max(0,c.hot-dt);if(c.hot>.12){c.dead=1;c.I=0;c.ev=1}}
  const tg=c.t=='bulb'?Math.min(1,i*i*27/3):c.t=='led'?clamp(i/.015,0,1):c.t=='grind'?clamp(Math.abs(i)/3.9,0,1):c.t=='kettle'?clamp(Math.abs(i)/9,0,1):0;c.glow+=(tg-c.glow)*.25})}

const fx=[];let tick=0;

function fxU(dt){for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.l-=dt;if(p.l<=0){fx.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.gr)p.r+=p.gr*dt}

function viz(dt){comps.forEach(c=>{const k=[Math.round(c.glow*12),c.dead,c.on,c.t=='led'?val(c):''].join();if(k!==c.key){c.key=k;c.sy.innerHTML=sym(c)}
  if(c.ev){c.ev=0;spark(c.x,c.y,22);smoke(c.x,c.y);snd('burn');toast(T[c.t].n+' yonib ketdi!')}
  if(c.t=='motor'||c.t=='grind'){c.ang+=c.I*(c.t=='grind'?160:500)*dt;const r=c.el.querySelector('.rot');if(r)r.setAttribute('transform',`rotate(${c.ang})`)}
  const tx=c.dead?'Yonib ketdi':c.t=='jn'?'':c.t=='vm'?fv(c.v):c.t=='am'?fi(c.I):`${fv(c.v)}  ${fi(c.I)}  ${fw(c.v*c.I)}`;if(c.lab.textContent!==tx)c.lab.textContent=tx});

  if(run){if(w.dead)w.wt=Math.max(0,w.wt-.2*dt);else{w.wt=Math.max(0,w.wt+((w.P/SQ[w.wd])/60-w.wt)*.5*dt);if(w.wt>=1){w.dead=1;w.I=0;const p=w.el.querySelector('.l').getPointAtLength(w.len/2);spark(p.x,p.y,16);smoke(p.x,p.y);snd('burn');toast('Sim qizib kuyib uzildi!')}}}
  heatW(w);const a=Math.abs(w.I);if(!run||w.dead||!(a>1e-4)){f.setAttribute('opacity',0);return}
  w.off-=Math.sign(w.I)*Math.min(90,12+a*300)*dt;f.setAttribute('stroke-dashoffset',w.off);f.setAttribute('opacity',Math.min(.9,.3+a*3))});
 fxU(dt);if(++tick%6==0)updInfo()}

function clampCam(){apply();return;let x0=-200,x1=200,y0=-200,y1=200;if(comps.size){x0=y0=1e9;x1=y1=-1e9;comps.forEach(c=>{x0=Math.min(x0,c.x-40);x1=Math.max(x1,c.x+40);y0=Math.min(y0,c.y-40);y1=Math.max(y1,c.y+40)})}
 const M=260,W=innerWidth,H=innerHeight;let cx=clamp((W/2-cam.x)/cam.k,x0-M,x1+M),cy=clamp((H/2-cam.y)/cam.k,y0-M,y1+M);cam.x=W/2-cx*cam.k;cam.y=H/2-cy*cam.k;apply()}

const cv=$('#cv'),dock=$('#dock'),P=new Map();let dr=null,pinch=null,pend=null,hl=null,popFor=null,popAt=[0,0];

 if(P.size>2)return;const el=e.target.closest('[data-t]'),t=el?el.dataset.t:'pan',id=el?+el.dataset.id:0;

 if(t=='pin'){const c=comps.get(id>>1),p=pin(c,id&1);dr.tmp=mkEl('path');dr.tmp.setAttribute('d',`M${p[0]} ${p[1]}L${p[0]} ${p[1]}`);dr.tmp.setAttribute('stroke','#f0a54a');dr.tmp.setAttribute('stroke-width',3);dr.tmp.setAttribute('stroke-dasharray','8 7');dr.tmp.setAttribute('fill','none');dr.tmp.setAttribute('stroke-linecap','round');$('#tl').appendChild(dr.tmp);dr.p=p}

addEventListener('pointermove',e=>{if(P.has(e.pointerId))P.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(!dr||e.pointerId!=dr.id)return;const dx=e.clientX-dr.sx,dy=e.clientY-dr.sy;if(Math.hypot(dx,dy)>6)dr.mv=1;

 else if(dr.t=='comp'&&dr.mv){const c=comps.get(dr.tid),[x,y]=w2(e.clientX,e.clientY);c.x=Math.round((x+dr.ox)/20)*20;c.y=Math.round((y+dr.oy)/20)*20;layout(c);c.el.style.opacity=e.clientX>innerWidth-dockW()?.35:1}

  presets:[['3 ta lampochka','Uch lampochka ketma-ket',{c:[['bat',-200,0,1],['bulb',-40,-60],['bulb',40,-60],['bulb',120,-60]],w:[[0,2],[3,4],[5,6],[7,1]]}]],
  // 3D stoldagi jihoz
  props:[{id:'kub',name:'Aylanuvchi kub',x:-4,z:-7,
    build:(T,g)=>{const m=new T.Mesh(new T.BoxGeometry(1,1,1),new T.MeshStandardMaterial({color:0xff6b6b}));m.position.y=.8;g.add(m)},
    update:(g,dt,t)=>{g.rotation.y=t}}],

// ---------- Laboratoriya paneli ----------
IC.puz='M10 3a2 2 0 0 1 4 0v2h4a1 1 0 0 1 1 1v4h-2a2 2 0 0 0 0 4h2v4a1 1 0 0 1-1 1h-4v-2a2 2 0 0 0-4 0v2H6a1 1 0 0 1-1-1v-4h2a2 2 0 0 0 0-4H5V6a1 1 0 0 1 1-1h4z';
$('#xb').innerHTML=ic('puz');$('#xb').onclick=()=>xopen?closeX():openX();
function openX(t){if(t)xtab=t;xopen=1;closePop();M.classList.remove('on');xp.classList.add('on');uiX();clearInterval(xtimer);
 xtimer=setInterval(()=>{if(xtab=='p')XPN.forEach(p=>{const el=xp.querySelector('[data-pn="'+p.ext+':'+p.id+'"]');if(el&&p.update)try{p.update(el,lab)}catch(_){}})},150)}
function closeX(){xopen=0;xp.classList.remove('on');clearInterval(xtimer)}
function uiX(){if(!xopen)return;const tb=[['t','Tajriba'],['j','Jihoz'],['p','Panel'],['e','Extension']];
 let h='<div class="xh"><b>🧪 Laboratoriya</b><button class="ib" data-x="close">'+ic('x')+'</button></div><div class="xt">'+tb.map(([k,n])=>'<button class="mb '+(k==xtab?'on':'')+'" data-x="tab" data-k="'+k+'">'+n+'</button>').join('')+'</div><div class="xb">';
 if(xtab=='t')h+=XPR.length?XPR.map((p,i)=>'<button class="xc" data-x="pr" data-i="'+i+'"><b>'+esc(p.n)+'</b><span>'+esc(p.d)+'</span></button>').join(''):'<p class="xn">Tajriba yoʻq</p>';
 else if(xtab=='j'){const ks=Object.keys(XP);h+=ks.length?ks.map(k=>'<button class="xc '+(XP[k].g?'on':'')+'" data-x="prop" data-k="'+k+'"><b>'+(XP[k].g?'✓ ':'')+esc(XP[k].def.name||XP[k].def.id)+'</b><span>3D stolga qoʻyish / olib tashlash</span></button>').join(''):'<p class="xn">Jihoz yoʻq</p>';
  if(XA.length)h+='<h4>Amallar</h4>'+XA.map((a,i)=>'<button class="xc" data-x="act" data-i="'+i+'"><b>'+esc(a.name)+'</b></button>').join('')}
 else if(xtab=='p')h+=XPN.length?XPN.map(p=>'<div class="xs"><h4>'+esc(p.name||p.id)+'</h4><div data-pn="'+p.ext+':'+p.id+'"></div></div>').join(''):'<p class="xn">Panel yoʻq. Tajribani tanlang.</p>';
 else h+='<div class="xs"><h4>Oʻz extension’ingiz</h4><input type="text" id="xn" placeholder="Nomi"><textarea id="xc" placeholder="KL.extension({id:…})"></textarea><div class="xg"><button class="mb" data-x="run">▶ Ishga tushir</button><button class="mb" data-x="file">Fayl</button><button class="mb" data-x="url">🔗 URL</button><button class="mb" data-x="dl">⬇ Namuna</button></div><div class="doc">Bitta <code>.js</code> fayl: <code>KL.extension({id,name,presets,props,panels,actions,on:{tick},css,setup,dispose})</code>. Faylni shu yerga sudrab tashlash ham mumkin; <code>?ext=URL</code> yoki <code>&lt;meta name="kl-extensions" content="a.js"&gt;</code> ham ishlaydi. <code>lab</code> orqali sxema (<code>load, place, addWire, comps</code>), 3D sahna (<code>scene, THREE</code>) va simulyatsiyaga kirish mumkin.</div></div><h4>Oʻrnatilganlar</h4>'+
  (EL.length?EL.map((x,i)=>'<div class="ex"><span>'+esc(x.name)+'</span><span><button class="mb" data-x="tog" data-i="'+i+'">'+(x.off?'Yoq':'Oʻchir')+'</button><button class="mb" data-x="del" data-i="'+i+'">✕</button></span></div>').join(''):'<p class="xn">Hozircha yoʻq. Ichki paket: Maktab fizika.</p>');
 xp.innerHTML=h+'</div>';
 if(xtab=='p')XPN.forEach(p=>{const el=xp.querySelector('[data-pn="'+p.ext+':'+p.id+'"]');if(el&&p.render)try{p.render(el,lab);p.update&&p.update(el,lab)}catch(e){el.textContent='Xato: '+e.message}})}
xp.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;const a=b.dataset.x,i=+b.dataset.i;
 if(a=='close')closeX();else if(a=='tab'){xtab=b.dataset.k;uiX()}
 else if(a=='pr'){const p=XPR[i];if(p.s){load(p.s);if(on3)rb3(1)}if(p.run)try{p.run(lab)}catch(er){toast(er.message)}toast(p.d||p.n)}
 else if(a=='prop'){setProp(b.dataset.k,!XP[b.dataset.k].g)}else if(a=='act'){try{XA[i].run(lab)}catch(er){toast(er.message)}}
 else if(a=='run'){const c=$('#xc').value;if(c.trim())install($('#xn').value.trim()||'Extension '+(EL.length+1),c)}
 else if(a=='file')pickFile();else if(a=='url')askUrl();else if(a=='dl')dlSample();
 else if(a=='tog'){const x=EL[i];if(x.off){x.off=false;await activate(x)}else{x.off=true;unrunEntry(x)}persist();uiX()}
 else if(a=='del'){unrunEntry(EL[i]);EL.splice(i,1);persist();uiX()}});

// ---------- ichki paket: MAKTAB FIZIKA (2 tajriba + maktab bezaklari) ----------
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o)),bxx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);return m};
const PM={L:.8,A:25,th:0,w:0,t:0,run:0,cr:[],Tm:0,n:0};
const OM={rows:[]};
const omRead=()=>{const b=lab.find('bat'),r=lab.find('res'),a=lab.find('am'),v=lab.find('vm');return b&&r&&a&&v?{b,r,a,v,U:Math.abs(v.v),I:Math.abs(a.I)}:null};
const fm=(x,u)=>x>=1?x.toFixed(2)+' '+u:(x*1000).toFixed(1)+' m'+u;
KL.extension({id:'maktab',name:'Maktab fizika',autoProps:['doska','kitob','qalam'],
 css:'',
 presets:[
  {name:'🔬 Om qonuni (I = U/R)',desc:'Batareya, rezistor, ampermetr va voltmetr. Kuchlanishni oʻzgartirib, U/I nisbatini kuzating. Panel → “Om qonuni”.',
   scene:{c:[['bat',-160,0,1],['am',0,-60],['res',0,60,0,2],['vm',0,140]],w:[[0,2],[3,5],[4,1],[6,4],[7,5]]},run:l=>{OM.rows=[];openX('p')}},
  {name:'🔬 Matematik mayatnik',desc:'Uzunlik va burchakni tanlang, qoʻyib yuboring: oʻlchangan davr T = 2π√(l/g) bilan solishtiriladi.',
   run:l=>{setProp('maktab:mayatnik',true);l.mode(1);l.fly(7,-3,10);openX('p')}}],
 panels:[
  {id:'om',name:'Om qonuni',render:el=>{el.innerHTML='<div class="xr"><span>Kuchlanish U (voltmetr)</span><b id="o-u">–</b></div><div class="xr"><span>Tok I (ampermetr)</span><b id="o-i">–</b></div><div class="xr"><span>U / I</span><b id="o-r">–</b></div><div class="xr"><span>Rezistor R</span><b id="o-R">–</b></div><div class="xg"><button class="mb" data-o="u">Batareya ⟳</button><button class="mb" data-o="r">Qarshilik ⟳</button><button class="mb" data-o="s">Yozib olish</button><button class="mb" data-o="c">Tozalash</button></div><table><thead><tr><th>U (V)</th><th>I (mA)</th><th>U/I (Ω)</th></tr></thead><tbody id="o-t"></tbody></table><p class="xn">Xulosa: U ortsa I ham shuncha ortadi, U/I esa R ga teng.</p>';
   el.onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const d=omRead();if(!d)return toast('Avval “Om qonuni” tajribasini tanlang');const k=b.dataset.o;
    if(k=='u'){d.b.vi=(d.b.vi+1)%T.bat.v.length;rb3()}else if(k=='r'){d.r.vi=(d.r.vi+1)%T.res.v.length;rb3()}
    else if(k=='s'&&d.I>1e-6){OM.rows.push([d.U,d.I*1000,d.U/d.I]);if(OM.rows.length>8)OM.rows.shift()}else if(k=='c')OM.rows=[]}},
   update:el=>{const d=omRead(),s=(i,t)=>{const n=el.querySelector('#'+i);if(n&&n.textContent!=t)n.textContent=t};if(!d){s('o-u','–');s('o-i','–');s('o-r','–');s('o-R','tajribani tanlang');return}
    s('o-u',d.U.toFixed(2)+' V');s('o-i',fm(d.I,'A'));s('o-r',d.I>1e-6?(d.U/d.I).toFixed(1)+' Ω':'–');s('o-R',fmtV(d.r)+(d.r.t=='res'?'':''));
    const t=el.querySelector('#o-t'),h=OM.rows.map(r=>'<tr><td>'+r[0].toFixed(2)+'</td><td>'+r[1].toFixed(1)+'</td><td>'+r[2].toFixed(1)+'</td></tr>').join('');if(t&&t.dataset.h!=h){t.dataset.h=h;t.innerHTML=h}}},
  {id:'myt',name:'Matematik mayatnik',render:el=>{el.innerHTML='<label class="xn">Uzunlik l: <b id="m-l"></b></label><input type="range" id="m-L" min="20" max="150" step="5"><label class="xn">Boshlangʻich burchak: <b id="m-a"></b></label><input type="range" id="m-A" min="5" max="40" step="1"><div class="xg"><button class="mb" data-m="go">▶ Qoʻyib yuborish</button><button class="mb" data-m="st">■ Toʻxtatish</button><button class="mb" data-m="fly">📍 Mayatnikka</button></div><div class="xr"><span>T nazariy 2π√(l/g)</span><b id="m-Tt">–</b></div><div class="xr"><span>T oʻlchangan</span><b id="m-Tm">–</b></div><div class="xr"><span>Tebranishlar</span><b id="m-n">0</b></div><p class="xn">g = 9.81 m/s². Uzunlik 4 baravar ortsa, davr 2 baravar ortadi. Katta burchakda T biroz uzayadi.</p>';
   const L=el.querySelector('#m-L'),A=el.querySelector('#m-A');L.value=PM.L*100;A.value=PM.A;
   L.oninput=()=>{PM.L=L.value/100;PM.run=0;PM.th=0;PM.w=0;PM.cr=[];PM.Tm=0;PM.n=0};A.oninput=()=>{PM.A=+A.value};
   el.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;setProp('maktab:mayatnik',true);const k=b.dataset.m;if(k=='go'){PM.th=PM.A*Math.PI/180;PM.w=0;PM.t=0;PM.cr=[];PM.Tm=0;PM.n=0;PM.run=1;PM.pv=PM.th}else if(k=='st')PM.run=0;else{lab.mode(1);lab.fly(7,-3,10)}}},
   update:el=>{const s=(i,t)=>{const n=el.querySelector('#'+i);if(n)n.textContent=t};s('m-l',(PM.L*100).toFixed(0)+' sm');s('m-a',PM.A+'°');s('m-Tt',(2*Math.PI*Math.sqrt(PM.L/9.81)).toFixed(3)+' s');s('m-Tm',PM.Tm?PM.Tm.toFixed(3)+' s':'–');s('m-n',PM.n)}}],
 props:[
  {id:'mayatnik',name:'Mayatnik qurilmasi',x:7,z:-3,build:(T3,g)=>{const wd=0x8a5a2b;g.add(bxx(3.6,.15,2,wd,0,.075,0),bxx(.18,5.4,.18,wd,-1.5,2.7,0),bxx(.18,5.4,.18,wd,1.5,2.7,0),bxx(3.4,.2,.2,wd,0,5.4,0));
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,1,6),mat(0xeeeeee)),b=new THREE.Mesh(new THREE.SphereGeometry(.24,24,16),mat(0xc0c8d0,{metalness:.8,roughness:.25}));g.add(s,b);g.userData.s=s;g.userData.b=b},
   update:(g,dt,t)=>{if(PM.run){const n=8,h=dt/n;PM.pv=PM.th;for(let i=0;i<n;i++){PM.w+=-(9.81/PM.L)*Math.sin(PM.th)*h;PM.th+=PM.w*h}PM.t+=dt;
     if(PM.pv<0&&PM.th>=0){const tc=PM.t-dt+dt*(-PM.pv)/(PM.th-PM.pv);PM.cr.push(tc);PM.n++;if(PM.cr.length>=2)PM.Tm=PM.cr[PM.cr.length-1]-PM.cr[PM.cr.length-2]}}
    const u=3,l=PM.L*u,y=5.3-l*Math.cos(PM.th),z=l*Math.sin(PM.th);g.userData.b.position.set(0,y,z);const s=g.userData.s;s.scale.y=l;s.position.set(0,5.3-l*Math.cos(PM.th)/2,z/2);s.rotation.x=-PM.th}},
  {id:'doska',name:'Maktab doskasi',x:0,z:-14,build:(T3,g)=>{const c=document.createElement('canvas');c.width=512;c.height=288;const x=c.getContext('2d');x.fillStyle='#2e5a45';x.fillRect(0,0,512,288);x.fillStyle='#f5f1de';x.font='bold 34px sans-serif';x.fillText('Fizika darsi',30,56);x.font='30px sans-serif';['I = U / R','P = U · I','T = 2π√(l/g)'].forEach((s,i)=>x.fillText(s,40,118+i*50));
    const m=new THREE.Mesh(new THREE.PlaneGeometry(7,3.9),mat(0xffffff,{map:new THREE.CanvasTexture(c),roughness:.9}));m.position.set(0,3.4,.01);g.add(bxx(7.4,4.3,.2,0x7a4a22,0,3.4,-.12),m,bxx(.2,1.5,.3,0x7a4a22,-3.2,.75,0),bxx(.2,1.5,.3,0x7a4a22,3.2,.75,0),bxx(6,.12,.4,0x7a4a22,0,1.25,.15))}},
  {id:'kitob',name:'Kitoblar',x:-9,z:-3,build:(T3,g)=>{[[2,.28,1.4,0xd9534f,0],[1.8,.24,1.3,0x4a90d9,.1],[1.9,.22,1.35,0xf0c040,-.08]].forEach((b,i)=>{const m=bxx(b[0],b[1],b[2],b[3],0,.14+i*.26,0);m.rotation.y=b[4];g.add(m)})}},
  {id:'qalam',name:'Qalam va chizgʻich',x:-6,z:6,build:(T3,g)=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,2.2,8),mat(0xffc93c)),t=new THREE.Mesh(new THREE.ConeGeometry(.09,.3,8),mat(0xe8c9a0));p.rotation.z=t.rotation.z=Math.PI/2;p.position.y=t.position.y=.09;t.position.x=1.25;g.add(p,t,bxx(2.6,.04,.4,0x6ec1e4,.3,.02,.9))}}]
});

// ---------- yuklash ----------
(async()=>{let sv=[];try{sv=JSON.parse(localStorage.getItem('bc3ext')||'[]')}catch(e){}
 const m=document.querySelector('meta[name=kl-extensions]'),us=[...(m?m.content.split(','):[]),...new URLSearchParams(location.search).getAll('ext')].map(q=>q.trim()).filter(Boolean);
 for(const x of sv){EL.push(x);if(!x.off)await activate(x)}for(const u of us)if(!EL.some(x=>x.url==u))await install(u,null,u)})();
syncB3();if(window.THREE){try{enter3()}catch(e){console.error(e)}}else toast('3D uchun internet kerak: 2D rejim ochiq');syncB3();

})();
